<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial;overflow:hidden}.hud{height:65px;display:flex;justify-content:space-between;align-items:center;padding:0 25px;background:#101010;border-bottom:1px solid #333}.arena{height:calc(100vh - 65px);position:relative;background:radial-gradient(circle,#242424,#050505 65%)}#target{position:absolute;width:80px;height:80px;border-radius:50%;border:6px solid #fff;background:#111;box-shadow:0 0 25px #fff;cursor:pointer;display:grid;place-items:center;font-size:28px;transition:.08s}.help{color:#888}</style></head><body><div class='hud'><b>BLP // SPACE CLICKER</b><span>Score: <b id='score'>0</b> &nbsp; Best: <b id='best'>0</b></span><span class='help'>Click the target</span></div><div class='arena' id='arena'><button id='target'>+</button></div><script>let s=0,b=+localStorage.getItem('blpSpaceBest')||0;best.textContent=b;function move(){target.style.left=Math.random()*Math.max(1,arena.clientWidth-90)+'px';target.style.top=Math.random()*Math.max(1,arena.clientHeight-90)+'px'}target.onclick=()=>{s++;score.textContent=s;if(s>b){b=s;best.textContent=b;localStorage.setItem('blpSpaceBest',b)}move()};move();addEventListener('resize',move)</script></body></html>
