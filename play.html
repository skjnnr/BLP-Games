<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Play | BLP Games</title><link rel='stylesheet' href='style.css'><style>.gamewrap{max-width:1100px;margin:30px auto;padding:0 20px}.gamehead{display:flex;justify-content:space-between;align-items:center}.back{color:#fff;text-decoration:none}.frame{width:100%;height:650px;border:1px solid #333;border-radius:16px;background:#000}.gamehead button{background:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:800;cursor:pointer}</style></head><body><header><a class='logo' href='index.html'>BLP <b>GAMES</b></a></header><div class='gamewrap'><div class='gamehead'><div><a class='back' href='index.html'>← All games</a><h1 id='title'>Game</h1></div><button id='full'>⛶ Fullscreen</button></div><iframe id='frame' class='frame' allowfullscreen></iframe></div><script src='games.js'></script><script>const id=new URLSearchParams(location.search).get('id'),g=GAMES.find(x=>x.id===id);if(g){title.textContent=g.name;document.title=g.name+' | BLP Games';frame.src='games/'+g.id+'/index.html'}else{title.textContent='Game not found'};full.onclick=()=>frame.requestFullscreen()</script></body></html>
