<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>BLP Games</title><link rel='stylesheet' href='style.css'></head><body>
<header><a class='logo' href='index.html'>BLP <b>GAMES</b></a><nav><button class='nav active' data-filter='all'>Games</button></nav><div class='search'><input id='search' placeholder='Search games...'><span>⌕</span></div><button id='theme' class='icon'>☾</button><button class='icon'>♥ <small id='favCount'>0</small></button><button id='accountBtn' class='account-btn'>Create Account</button><button id='logoutBtn' class='logout-btn' hidden>Log Out</button></header>
<main><section class='hero'><div><span class='pill'>FEATURED GAME</span><h1>SPACE CLICKER</h1><p>Hit the target, build your score, and climb higher. Your first playable BLP Games title is ready.</p><a class='play' href='play.html?id=space-clicker'>▶ PLAY NOW</a></div><div class='hero-art'><div class='planet'></div><div class='ship'>▲</div></div></section>
<section class='bar'><h2>Games</h2><div id='categories'><button class='chip selected' data-category='all'>All</button></div></section>
<section id='grid' class='grid'></section></main>
<dialog id='authModal' class='auth-modal'><div class='auth-box'><button id='closeAuth' class='auth-close' type='button'>×</button><div class='auth-brand'>BLP <b>GAMES</b></div><h2 id='authTitle'>Create your BLP account</h2><p class='auth-sub'>Save your account securely with Supabase.</p><form id='authForm'><div id='signupFields'><label>Username<input id='authUsername' autocomplete='username' maxlength='20' placeholder='Your username'></label></div><label>Email<input id='authEmail' type='email' autocomplete='email' required placeholder='you@example.com'></label><label>Password<input id='authPassword' type='password' autocomplete='current-password' minlength='6' required placeholder='At least 6 characters'></label><button id='submitAuth' class='auth-submit' type='submit'>Create Account</button></form><p id='authMessage' class='auth-message'></p><button id='switchAuth' class='auth-switch' type='button'>Already have an account? Log in</button></div></dialog><footer><b>BLP Games</b><span>Play. Discover. Repeat.</span><span>© 2026 BLP Games</span></footer><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='supabase-config.js'></script><script src='games.js'></script><script src='app.js'></script><script src='auth.js'></script></body></html>
